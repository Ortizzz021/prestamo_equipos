name: prestamo_equipos
description: "G61-1 Préstamo de equipos tecnológicos - Proyecto final Desarrollo Móvil 2026-2."
publish_to: 'none'

# Versión de la app: <versionName>+<versionCode>. Se actualiza en cada APK de entrega.
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Estado
  provider: ^6.1.5

  # Catálogo remoto HTTP/JSON
  http: ^1.5.0

  # Persistencia local (Drift / SQLite)
  drift: ^2.28.0
  sqlite3_flutter_libs: ^0.5.39
  path_provider: ^2.1.5

  # Preferencias simples (filtro de catálogo)
  shared_preferences: ^2.5.3

  # Identidad estable de solicitudes y detección de conectividad
  uuid: ^4.5.1
  connectivity_plus: ^7.0.0

  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  firebase_crashlytics: ^6.0.1
  drift_flutter: ^0.2.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Generación de código de Drift
  drift_dev: ^2.28.0
  build_runner: ^2.7.0
flutter:
  uses-material-design: true
